# Projet : opencode-docker
# Usage :  docker compose run --rm opencode          (TUI)
#          docker compose run --rm opencode run "..." (one-shot)
# Purge :  docker compose down -v                     (supprime TOUT, volumes compris)

name: opencode

services:
  opencode:
    build:
      context: .
      dockerfile: Dockerfile
    image: opencode-local:2.0.18
    stdin_open: true      # requis pour le TUI
    tty: true
    # Le repo est monte sous SON NOM (pas /work) : le TUI, les sessions
    # OpenCode et les logs identifient le bon projet.
    # OC_NAME = nom du dossier, calcule par opencode.bat (défaut : workspace)
    hostname: ${OC_NAME:-workspace}
    working_dir: /projects/${OC_NAME:-workspace}
    # Clés API lues depuis .env (jamais dans l'image ni dans le compose)
    env_file:
      - path: .env
        required: false
    environment:
      # Config pointée vers le fichier monté en lecture seule (voir ./config)
      OPENCODE_CONFIG: /config/opencode.json
      TZ: Europe/Paris
    volumes:
      # --- État OpenCode nommé (purge en 1 commande avec `down -v`) ---
      - oc-data:/home/opencode/.local/share/opencode   # sessions, auth.json
      - oc-cache:/home/opencode/.cache/opencode        # plugins npm installés
      - oc-config:/home/opencode/.config/opencode      # config GLOBALE (plugin add)
      # --- Config en lecture seule (versionnée, sans clé) ---
      - ./config/opencode.json:/config/opencode.json:ro
      # --- Projet monté sous SON NOM : /projects/<nom-du-dossier> ---
      - "${PROJECT_DIR:-./workspace}:/projects/${OC_NAME:-workspace}"
      # --- Git : identité + credentials hôtes (optionnel) ---
      # - ${USERPROFILE:-~}/.gitconfig:/home/opencode/.gitconfig:ro
      # - ${SSH_AUTH_SOCK}:/ssh-agent  # push via agent ssh (WSL/Git-Bash)
    # --- Rôles ---
    #   défaut  : user "opencode" (uid 1000), agent YOLO, sudo sans mdp
    #   root    : docker compose run --rm --user root opencode ...
    #   interne : sudo -i   (dans le conteneur, aucun mot de passe)
    #
    # NOTE : no-new-privileges est volontairement ABSENT — il bloquerait
    # sudo (escalade setuid). L'isolation vient du conteneur + /work monté.
    security_opt: []
    # Écriture possible : /work (projet) + volumes nommés ci-dessus.
    read_only: false
    # PID 1 = tini : récolte les process zombies (sessions multiples)
    init: true
    # Limite disque des volumes (au-delà, docker écriture échoue proprement)
    # (non supporté partout → commenté par défaut)
    # deploy: { resources: { limits: { storage: 10G } } }

  # --- Mode long-lived (profil "serve") ---
  # Une seule instance qui vit en continu : sessions, TUI et API ne sont
  # plus recréés à chaque invocation (zéro coupure en cours de génération).
  #   demarrage : docker compose --profile serve up -d
  #   arret     : docker compose --profile serve down
  #   etat      : docker compose --profile serve ps
  opencode-serve:
    profiles: ["serve"]
    build:
      context: .
      dockerfile: Dockerfile
    image: opencode-local:2.0.18
    command: ["serve", "--hostname", "0.0.0.0"]
    ports:
      - "4096:4096"
    hostname: ${OC_NAME:-workspace}
    working_dir: /projects/${OC_NAME:-workspace}
    env_file:
      - path: .env
        required: false
    environment:
      OPENCODE_CONFIG: /config/opencode.json
      TZ: Europe/Paris
    volumes:
      - oc-data:/home/opencode/.local/share/opencode
      - oc-cache:/home/opencode/.cache/opencode
      - oc-config:/home/opencode/.config/opencode
      - ./config/opencode.json:/config/opencode.json:ro
      - "${PROJECT_DIR:-./workspace}:/projects/${OC_NAME:-workspace}"
    security_opt: []
    read_only: false
    init: true
    restart: unless-stopped

volumes:
  oc-data:
  oc-cache:
  oc-config:
